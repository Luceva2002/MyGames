# Il sito di Tavolata: file statici, e ogni indirizzo che non è un file (/room/ABCD, /giochi…) apre l'app.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # File col nome che cambia a ogni versione: si tengono in cache a lungo.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # La pagina dell'app non va mai in cache, così dopo un aggiornamento si vede subito la versione nuova.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
